name: Build & Push Docker Image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]   # optional: Tags für Releases
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # z.B. meinuser/mein-repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # wichtig: Schreibrechte für ghcr.io

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Docker Buildx einrichten
        uses: docker/setup-buildx-action@v3

      - name: Bei ghcr.io anmelden
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadaten (Tags & Labels) erzeugen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch              # z.B. main
            type=semver,pattern={{version}}    # z.B. 1.2.3 bei Tag v1.2.3
            type=sha                            # Kurz-Hash des Commits

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}  # PRs nur bauen, nicht pushen
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha                   # Build-Cache über GitHub Actions
          cache-to: type=gha,mode=max
